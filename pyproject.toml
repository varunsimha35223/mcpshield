[project]
name = "mcpshield"
version = "0.1.0"
description = "Static scanner that checks MCP servers for tool poisoning, hidden Unicode, and rug pulls"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
mcpshield = "mcpshield.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpshield"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
